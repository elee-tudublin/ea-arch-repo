apiVersion: v1
kind: ConfigMap
metadata:
  name: openchat-config
  namespace: openchat-dev
data:
  ENV: "dev"
  LOG_LEVEL: "INFO"
  SERVICE_VERSION: "1.0.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4318"
  DATABASE_URL: "postgresql://openchat:openchat@postgres.openchat-dev:5432/openchat"
  ENABLE_MESSAGING: "false"
