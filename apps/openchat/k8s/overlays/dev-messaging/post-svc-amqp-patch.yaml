apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-svc
  namespace: openchat-dev
spec:
  template:
    spec:
      containers:
        - name: post-svc
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-conn
                  key: RABBITMQ_URL
