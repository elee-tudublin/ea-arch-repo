apiVersion: apps/v1
kind: Deployment
metadata:
  name: thread-svc
  namespace: openchat-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thread-svc
  template:
    metadata:
      labels:
        app: thread-svc
    spec:
      containers:
        - name: thread-svc
          image: openchat/thread-svc:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: openchat-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: thread-svc
  namespace: openchat-dev
spec:
  selector:
    app: thread-svc
  ports:
    - name: http
      port: 80
      targetPort: 8080
